<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Ecriture'; src: url('polices/patrick.ttf'); }
  @font-face { font-family: 'Manuscrit'; src: url('polices/caveat.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }

  /* ===== Cahier d'écolier : papier crème + quadrillage Seyès + marge rouge ===== */
  body {
    font-family: 'Ecriture', sans-serif;
    color: #1a3a8f; /* encre bleue */
    position: relative;
    background-color: #fbf7ec;
    background-image:
      linear-gradient(rgba(122,166,210,.42) 2px, transparent 2px),
      linear-gradient(rgba(122,166,210,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(160,140,200,.20) 1px, transparent 1px);
    background-size: 100% 76px, 100% 19px, 76px 100%;
    background-position: 0 14px, 0 14px, 38px 0;
  }
  #marge {
    position: absolute; top: 0; bottom: 0; left: 128px;
    width: 3px; background: rgba(224,49,49,.55);
  }
  /* ombre de reliure à gauche */
  #reliure {
    position: absolute; top: 0; bottom: 0; left: 0; width: 46px;
    background: linear-gradient(90deg, rgba(90,70,40,.18), transparent);
  }

  /* ===== En-tête : titre souligné à la main + niveau surligné ===== */
  #entete { position: absolute; top: 78px; left: 170px; right: 60px; }
  #titre-cahier {
    font-family: 'Manuscrit'; font-weight: 700; font-size: 88px; color: #16307a;
    display: inline-block; line-height: 1; transform: rotate(-1.2deg);
  }
  #titre-cahier svg { display: block; margin-top: 2px; }
  #niveau { text-align: right; margin-top: 10px; }
  #niveau span {
    display: inline-block; transform: rotate(1.4deg);
    font-family: 'Manuscrit'; font-weight: 700; font-size: 54px; color: #7a4b12;
    background: linear-gradient(104deg, transparent 4%, #ffe066 6%, #ffd43b 94%, transparent 96%);
    padding: 2px 30px 8px;
  }

  /* ===== Scène ===== */
  #scene {
    position: absolute; top: 400px; bottom: 300px; left: 170px; right: 70px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 58px; text-align: center;
  }
  .ligne { opacity: 0; will-change: transform, opacity; position: relative; }

  .ligne.kicker {
    font-family: 'Manuscrit'; font-weight: 700; font-size: 64px; color: #7a4b12;
    background: linear-gradient(100deg, transparent 3%, #ffe066 5%, #ffd43b 95%, transparent 97%);
    padding: 0 30px 6px; transform-origin: center;
  }
  .ligne.titre { font-size: 96px; line-height: 1.15; color: #16307a; }
  .ligne.math  { font-size: 150px; color: #16307a; letter-spacing: 4px; }
  .ligne.etape { font-size: 86px; color: #3557b7; }
  .ligne.note  { font-size: 58px; color: #6b7a99; line-height: 1.4; }
  .ligne.emoji { font-size: 140px; }

  /* résultat : encre rouge, entouré au stylo comme une correction */
  .ligne.accent {
    font-size: 160px; color: #d0342c; letter-spacing: 4px; padding: 6px 60px;
  }
  .ligne.accent::before {
    content: ''; position: absolute; inset: -26px -18px;
    border: 7px solid rgba(208,52,44,.85);
    border-radius: 49% 51% 47% 53% / 60% 42% 58% 40%;
    transform: rotate(-1.8deg);
  }

  /* ===== Pied : signature crayon + trait de progression ===== */
  #pied {
    position: absolute; bottom: 128px; left: 0; right: 0; text-align: center;
    font-family: 'Manuscrit'; font-size: 46px; color: #8a8578;
  }
  #barre-zone { position: absolute; bottom: 74px; left: 170px; right: 90px; height: 20px; }
  #barre {
    height: 7px; width: 0%; border-radius: 4px;
    background: repeating-linear-gradient(90deg, #5c5648 0 26px, #6e6858 26px 34px);
    transform: rotate(-.25deg);
  }
  #crayon { position: absolute; top: -26px; left: 0; font-size: 52px; transform: translateX(-14px) rotate(38deg); }
</style>
</head>
<body>
  <div id="reliure"></div>
  <div id="marge"></div>
  <div id="entete">
    <div id="titre-cahier">L'Atelier des Maths
      <svg width="620" height="20" viewBox="0 0 620 20">
        <path d="M4 12 Q 150 4, 310 11 T 616 9" fill="none" stroke="#d0342c" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="niveau"><span id="niveau-txt"></span></div>
  </div>
  <div id="scene"></div>
  <div id="pied">@latelierdesmaths &nbsp;&middot;&nbsp; un jour, une notion</div>
  <div id="barre-zone"><div id="barre"><span id="crayon">&#9999;&#65039;</span></div></div>

<script>
  // Rendu 100 % déterministe : l'état visuel ne dépend que de setTime(t).
  let SPEC = null;
  const APPARITION = 0.5;
  const SORTIE = 0.28;

  // petite rotation "posée à la main", stable par ligne
  function pente(sceneIdx, ligneIdx) {
    const x = Math.sin(sceneIdx * 37.7 + ligneIdx * 91.3) * 10000;
    return ((x - Math.floor(x)) - 0.5) * 2.4; // -1.2° à +1.2°
  }

  function initSpec(spec) {
    SPEC = spec;
    document.getElementById('niveau-txt').textContent = spec.niveau || 'Astuce';
    setTime(0);
  }

  const easeOut = x => 1 - Math.pow(1 - x, 3);

  function setTime(t) {
    const conteneur = document.getElementById('scene');
    const barre = document.getElementById('barre');
    barre.style.width = (100 * Math.min(1, t / SPEC.total)) + '%';
    document.getElementById('crayon').style.left = '100%';

    let scene = SPEC.scenes[SPEC.scenes.length - 1];
    for (const s of SPEC.scenes) {
      if (t < s.start + s.dur) { scene = s; break; }
    }

    if (conteneur.dataset.scene !== String(scene.index)) {
      conteneur.dataset.scene = String(scene.index);
      conteneur.innerHTML = '';
      for (const ligne of scene.lines) {
        const div = document.createElement('div');
        div.className = 'ligne ' + (ligne.style || 'titre');
        div.textContent = ligne.text;
        conteneur.appendChild(div);
      }
    }

    const local = t - scene.start;
    const finProche = Math.max(0, (scene.start + scene.dur - t) / SORTIE);
    const fadeOut = scene.index < SPEC.scenes.length - 1 ? Math.min(1, finProche) : 1;

    scene.lines.forEach((ligne, i) => {
      const div = conteneur.children[i];
      const p = Math.max(0, Math.min(1, (local - ligne.at) / APPARITION));
      const e = easeOut(p);
      const rot = pente(scene.index, i);
      div.style.opacity = (e * fadeOut).toFixed(3);
      // apparition "écrite" : balayage de gauche à droite + légère pose
      div.style.clipPath = `inset(-60px ${(1 - e) * 100}% -60px -60px)`;
      div.style.transform = `translateY(${(1 - e) * 14}px) rotate(${rot.toFixed(2)}deg)`;
    });
  }

  window.initSpec = initSpec;
  window.setTime = setTime;
</script>
</body>
</html>
